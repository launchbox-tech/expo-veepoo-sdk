name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun install cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        # --ignore-scripts: bun on Linux doesn't set executable bits on subcommand
        # bin files (e.g. expo-module-prepublishOnly) that aren't declared in the
        # package's `bin` field, so the `prepare` hook crashes during install. We
        # run `bun run build` explicitly below, which is what `prepare` would have
        # done anyway.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Restore executable bits on expo-module-scripts bins
        # The `expo-module` CLI delegates to sibling executables (expo-module-test,
        # expo-module-jest, etc.) that aren't declared in expo-module-scripts' `bin`
        # field, so bun leaves them non-executable on Linux. chmod them back.
        run: chmod +x node_modules/expo-module-scripts/bin/expo-module-*

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Verify Veepoo events bridge contract
        run: node build/bridge-contract/run-contract-checks.js veepoo-events

      - name: Verify native rejection bridge contract
        run: node build/bridge-contract/run-contract-checks.js native-rejection

      - name: Verify device-function key contract
        run: node build/bridge-contract/run-contract-checks.js device-function-keys

      - name: Verify social-message key contract
        run: node build/bridge-contract/run-contract-checks.js social-msg-keys

      - name: Verify vendor manifest
        run: bun run vendor:check

      - name: Compute SDK snapshot cache keys
        id: sdk-keys
        run: |
          echo "android=$(node -e "const m=require('./vendor-manifest.json'); process.stdout.write(m.upstreamReference.androidBleSdk.lastReviewedHeadSha)")" >> $GITHUB_OUTPUT
          echo "ios=$(node -e "const m=require('./vendor-manifest.json'); process.stdout.write(m.upstreamReference.iosBleSdk.lastReviewedHeadSha)")" >> $GITHUB_OUTPUT

      - name: Cache Android SDK snapshot
        uses: actions/cache@v5
        with:
          path: vendor-sdk-snapshots/android/
          key: android-sdk-${{ steps.sdk-keys.outputs.android }}

      - name: Cache iOS SDK snapshot
        uses: actions/cache@v5
        with:
          path: vendor-sdk-snapshots/ios/
          key: ios-sdk-${{ steps.sdk-keys.outputs.ios }}

      - name: Fetch SDK snapshots
        run: bash scripts/fetch-sdk-snapshots.sh

      - name: Verify upstream SDK coverage
        run: node build/bridge-contract/run-contract-checks.js upstream-sdk

      - name: Test with coverage
        run: bun run test:coverage
        env:
          CI: true

      - name: Set up JDK (for Kotlin native-surface test)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Kotlin compiler
        id: cache-kotlinc
        uses: actions/cache@v5
        with:
          path: ~/.kotlinc-2.0.21
          key: kotlinc-2.0.21

      - name: Install Kotlin compiler
        if: steps.cache-kotlinc.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o /tmp/kotlinc.zip
          mkdir -p ~/.kotlinc-2.0.21
          unzip -q /tmp/kotlinc.zip -d ~/.kotlinc-2.0.21

      - name: Run Kotlin AsyncFunction surface test
        # JVM-only smoke test: compiles + runs the Kotlin scaffold in
        # android/src/test against junit. No Android SDK, no vendor frameworks,
        # no Gradle wrapper. Mirrors the JS test as a per-platform sanity
        # check so a future Kotlin refactor that drops a method fails here too.
        run: |
          mkdir -p /tmp/native-test-deps
          for spec in \
            'junit/junit/4.13.2/junit-4.13.2.jar' \
            'org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar'; do
            file=/tmp/native-test-deps/$(basename "$spec")
            [ -f "$file" ] || curl -sSL "https://repo1.maven.org/maven2/$spec" -o "$file"
          done
          KOTLINC=$HOME/.kotlinc-2.0.21/kotlinc
          KOTLIN_STDLIB=$KOTLINC/lib/kotlin-stdlib.jar
          export PATH="$KOTLINC/bin:$PATH"
          kotlinc -cp /tmp/native-test-deps/junit-4.13.2.jar \
            android/src/test/kotlin/expo/modules/veepoo/AsyncFunctionSurfaceTest.kt \
            -d /tmp/native-async-surface-test.jar
          java -cp "/tmp/native-async-surface-test.jar:/tmp/native-test-deps/junit-4.13.2.jar:/tmp/native-test-deps/hamcrest-core-1.3.jar:$KOTLIN_STDLIB" \
            org.junit.runner.JUnitCore expo.modules.veepoo.AsyncFunctionSurfaceTest

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Separate job, and deliberately not `needs:` the Linux one.
  #
  # WHY A JOB AND NOT A STEP: the `test` job runs on ubuntu-latest, which has no
  # Xcode — a Swift step there could only ever be skipped. WHY NOT `needs: test`:
  # the two are independent, and serializing would put the ~10 minute Xcode build
  # in front of nothing useful while delaying no failure.
  #
  # WHY IN CI AT ALL, given macOS minutes bill at 10x on a private repo: the
  # failure this exists to catch was green CI plus a downstream consumer finding
  # the break (`NSUInteger` in VeepooSDKModule+ReadHelpers.swift, fixed in
  # 2600d26). A local-only check would have depended on the same discipline that
  # already let it through. The job is kept narrow to earn its cost — it builds
  # the VeepooSDK pod target only, not the app, and the workflow's
  # cancel-in-progress concurrency group caps the waste on rapid re-pushes.
  ios-swift:
    name: Compile iOS Swift sources
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Xcode version
        # The gate was developed against Xcode 26.4. macos-latest moves, and a
        # runner Xcode that lags this project's Expo 56 / RN 0.85 graph fails in
        # a way that reads like a code error. Print it first so run #1 diagnoses
        # itself; pin with `sudo xcode-select -s /Applications/Xcode_<v>.app`
        # here if the default turns out to be too old.
        run: xcodebuild -version && xcode-select -p

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun install cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'example/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache CocoaPods downloads
        # Expo ships its pods precompiled, so `pod install` pulls xcframeworks
        # over the network. Caching the download caches (not example/ios/Pods,
        # which is regenerated by prebuild every run and would go stale silently)
        # is what makes this job's setup cost predictable.
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('example/bun.lock', 'ios/VeepooSDK.podspec') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        # --ignore-scripts + chmod: same workaround as the Linux job. bun leaves
        # expo-module-scripts' undeclared sibling bins non-executable on macOS
        # too, which breaks the `prepare` hook.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Restore executable bits on expo-module-scripts bins
        run: chmod +x node_modules/expo-module-scripts/bin/expo-module-*

      - name: Build
        # Emits build/plugin/index.js, which example/app.json's "expo-veepoo-sdk"
        # config plugin resolves to. `expo prebuild` fails without it.
        run: bun run build

      - name: Compile iOS Swift sources (device SDK)
        # `iphoneos` only, not the script's default of both SDKs. The simulator
        # pass is ~2 of the job's ~7 minutes, and at the 10x private-repo macOS
        # multiplier that is the cheapest thing to cut: the simulator slice is
        # what every `expo run:ios` compiles all day, so a break on that side of
        # `#if targetEnvironment(simulator)` surfaces in minutes anyway. The
        # device slice is the one nobody exercises by accident — and the one
        # that let NSUInteger reach a consumer's release build.
        #
        # scripts/ci-local.sh still runs both; see its header.
        run: bash scripts/ios-swift-gate.sh iphoneos
